<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     shape-rendering="crispEdges">

    <!-- Shadow -->
    <rect x="15" y="59" width="34" height="2" fill="#c8b8df"/>

    <!-- Tail -->
    <rect x="48" y="25" width="6" height="22" fill="#392b35"/>
    <rect x="52" y="20" width="6" height="12" fill="#392b35"/>
    <rect x="50" y="27" width="4" height="18" fill="#d89568"/>
    <rect x="54" y="22" width="4" height="9" fill="#d89568"/>
    <rect x="56" y="23" width="2" height="5" fill="#e3a477"/>

    <!-- Body -->
    <rect x="18" y="33" width="29" height="21" fill="#392b35"/>
    <rect x="21" y="50" width="23" height="7" fill="#392b35"/>

    <rect x="20" y="35" width="25" height="18" fill="#e7aa7b"/>
    <rect x="23" y="49" width="19" height="6" fill="#e7aa7b"/>

    <!-- Chest -->
    <rect x="27" y="37" width="12" height="16" fill="#fff4e8"/>
    <rect x="24" y="42" width="4" height="9" fill="#fff4e8"/>
    <rect x="38" y="42" width="4" height="9" fill="#fff4e8"/>

    <!-- Paws -->
    <rect x="14" y="38" width="10" height="13" fill="#392b35"/>
    <rect x="16" y="40" width="7" height="9" fill="#fff4e8"/>

    <rect x="39" y="37" width="11" height="14" fill="#392b35"/>
    <rect x="40" y="39" width="8" height="10" fill="#fff4e8"/>

    <!-- Head -->
    <rect x="12" y="9" width="40" height="30" fill="#392b35"/>

    <!-- Ears -->
    <rect x="13" y="4" width="11" height="11" fill="#392b35"/>
    <rect x="40" y="4" width="11" height="11" fill="#392b35"/>

    <rect x="15" y="6" width="8" height="9" fill="#d89568"/>
    <rect x="17" y="7" width="5" height="6" fill="#ff9fb2"/>

    <rect x="42" y="6" width="8" height="9" fill="#d89568"/>
    <rect x="43" y="7" width="5" height="6" fill="#ff9fb2"/>

    <!-- Face -->
    <rect x="14" y="12" width="36" height="24" fill="#e7aa7b"/>
    <rect x="23" y="13" width="18" height="23" fill="#fff4e8"/>
    <rect x="19" y="17" width="26" height="18" fill="#fff4e8"/>

    <!-- Forehead -->
    <rect x="27" y="13" width="4" height="7" fill="#d89568"/>
    <rect x="34" y="13" width="4" height="7" fill="#d89568"/>

    <!-- Eyes -->
    <rect x="20" y="21" width="7" height="8" fill="#392b35"/>
    <rect x="37" y="21" width="7" height="8" fill="#392b35"/>
    <rect x="21" y="22" width="2" height="2" fill="#ffffff"/>
    <rect x="38" y="22" width="2" height="2" fill="#ffffff"/>

    <!-- Blush -->
    <rect x="16" y="29" width="6" height="3" fill="#ffb1b5"/>
    <rect x="42" y="29" width="6" height="3" fill="#ffb1b5"/>

    <!-- Nose -->
    <rect x="30" y="28" width="5" height="4" fill="#ff8fa5"/>

    <!-- Open mouth -->
    <rect x="29" y="32" width="7" height="4" fill="#392b35"/>
    <rect x="31" y="34" width="3" height="2" fill="#ff8fa5"/>

    <!-- Whiskers -->
    <rect x="8" y="27" width="7" height="1" fill="#392b35"/>
    <rect x="7" y="31" width="8" height="1" fill="#392b35"/>
    <rect x="49" y="27" width="7" height="1" fill="#392b35"/>
    <rect x="49" y="31" width="8" height="1" fill="#392b35"/>

    <!-- Collar -->
    <rect x="22" y="37" width="20" height="3" fill="#ef6f91"/>

    <!-- Bell -->
    <rect x="30" y="39" width="5" height="5" fill="#f5c84c"/>
    <rect x="31" y="43" width="3" height="2" fill="#d69b26"/>

</svg>