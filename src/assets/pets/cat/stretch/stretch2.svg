<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     shape-rendering="crispEdges">

    <!-- Shadow -->
    <rect x="9" y="58" width="46" height="3" fill="#c8b8df"/>
    <rect x="17" y="61" width="30" height="1" fill="#d8cceb"/>

    <!-- Tail -->
    <rect x="47" y="33" width="6" height="19" fill="#392b35"/>
    <rect x="52" y="28" width="6" height="13" fill="#392b35"/>
    <rect x="55" y="31" width="5" height="9" fill="#392b35"/>

    <rect x="49" y="35" width="4" height="16" fill="#d89568"/>
    <rect x="54" y="30" width="4" height="10" fill="#d89568"/>
    <rect x="56" y="33" width="3" height="5" fill="#e3a477"/>

    <!-- Lowered body -->
    <rect x="17" y="36" width="32" height="18" fill="#392b35"/>
    <rect x="20" y="50" width="27" height="8" fill="#392b35"/>

    <rect x="19" y="38" width="28" height="14" fill="#e7aa7b"/>
    <rect x="22" y="50" width="23" height="6" fill="#e7aa7b"/>

    <!-- Chest -->
    <rect x="27" y="40" width="13" height="13" fill="#fff4e8"/>
    <rect x="23" y="44" width="5" height="8" fill="#fff4e8"/>
    <rect x="39" y="44" width="5" height="8" fill="#fff4e8"/>

    <!-- Long left paw -->
    <rect x="7" y="49" width="19" height="7" fill="#392b35"/>
    <rect x="9" y="50" width="16" height="4" fill="#fff4e8"/>

    <!-- Long right paw -->
    <rect x="38" y="49" width="19" height="7" fill="#392b35"/>
    <rect x="40" y="50" width="16" height="4" fill="#fff4e8"/>

    <!-- Head -->
    <rect x="12" y="10" width="40" height="30" fill="#392b35"/>

    <!-- Ears -->
    <rect x="13" y="5" width="11" height="11" fill="#392b35"/>
    <rect x="40" y="5" width="11" height="11" fill="#392b35"/>

    <rect x="15" y="7" width="8" height="9" fill="#d89568"/>
    <rect x="17" y="8" width="5" height="6" fill="#ff9fb2"/>

    <rect x="42" y="7" width="8" height="9" fill="#d89568"/>
    <rect x="43" y="8" width="5" height="6" fill="#ff9fb2"/>

    <!-- Face -->
    <rect x="14" y="13" width="36" height="24" fill="#e7aa7b"/>
    <rect x="23" y="14" width="18" height="23" fill="#fff4e8"/>
    <rect x="19" y="18" width="26" height="18" fill="#fff4e8"/>

    <!-- Forehead -->
    <rect x="27" y="14" width="4" height="7" fill="#d89568"/>
    <rect x="34" y="14" width="4" height="7" fill="#d89568"/>

    <!-- Relaxed eyes -->
    <rect x="20" y="24" width="7" height="2" fill="#392b35"/>
    <rect x="37" y="24" width="7" height="2" fill="#392b35"/>

    <!-- Blush -->
    <rect x="16" y="30" width="6" height="3" fill="#ffb1b5"/>
    <rect x="42" y="30" width="6" height="3" fill="#ffb1b5"/>

    <!-- Nose -->
    <rect x="30" y="29" width="5" height="4" fill="#ff8fa5"/>

    <!-- Mouth -->
    <rect x="29" y="33" width="3" height="2" fill="#392b35"/>
    <rect x="33" y="33" width="3" height="2" fill="#392b35"/>
    <rect x="31" y="35" width="3" height="2" fill="#392b35"/>

    <!-- Whiskers -->
    <rect x="8" y="28" width="7" height="1" fill="#392b35"/>
    <rect x="7" y="32" width="8" height="1" fill="#392b35"/>
    <rect x="49" y="28" width="7" height="1" fill="#392b35"/>
    <rect x="49" y="32" width="8" height="1" fill="#392b35"/>

    <!-- Collar -->
    <rect x="22" y="38" width="20" height="3" fill="#ef6f91"/>

    <!-- Bell -->
    <rect x="30" y="40" width="5" height="5" fill="#f5c84c"/>
    <rect x="31" y="44" width="3" height="2" fill="#d69b26"/>

</svg>