<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     shape-rendering="crispEdges">

    <!-- Shadow -->
    <rect x="11" y="57" width="42" height="3" fill="#c8b8df"/>
    <rect x="18" y="60" width="28" height="1" fill="#d8cceb"/>

    <!-- Tail outline -->
    <rect x="46" y="34" width="6" height="18" fill="#392b35"/>
    <rect x="51" y="29" width="6" height="13" fill="#392b35"/>
    <rect x="54" y="32" width="5" height="9" fill="#392b35"/>

    <!-- Tail -->
    <rect x="48" y="36" width="4" height="15" fill="#d89568"/>
    <rect x="53" y="31" width="4" height="10" fill="#d89568"/>
    <rect x="55" y="34" width="3" height="5" fill="#e3a477"/>

    <!-- Body outline -->
    <rect x="17" y="34" width="31" height="19" fill="#392b35"/>
    <rect x="21" y="49" width="24" height="8" fill="#392b35"/>

    <!-- Body -->
    <rect x="19" y="36" width="27" height="15" fill="#e7aa7b"/>
    <rect x="22" y="49" width="21" height="6" fill="#e7aa7b"/>

    <!-- Chest -->
    <rect x="27" y="38" width="13" height="14" fill="#fff4e8"/>
    <rect x="24" y="42" width="4" height="9" fill="#fff4e8"/>
    <rect x="39" y="42" width="4" height="9" fill="#fff4e8"/>

    <!-- Left stretched paw -->
    <rect x="10" y="47" width="15" height="7" fill="#392b35"/>
    <rect x="12" y="48" width="12" height="4" fill="#fff4e8"/>

    <!-- Right stretched paw -->
    <rect x="38" y="47" width="15" height="7" fill="#392b35"/>
    <rect x="40" y="48" width="12" height="4" fill="#fff4e8"/>

    <!-- Head outline -->
    <rect x="12" y="10" width="40" height="30" fill="#392b35"/>

    <!-- Ears -->
    <rect x="13" y="5" width="11" height="11" fill="#392b35"/>
    <rect x="40" y="5" width="11" height="11" fill="#392b35"/>

    <!-- Left ear -->
    <rect x="15" y="7" width="8" height="9" fill="#d89568"/>
    <rect x="17" y="8" width="5" height="6" fill="#ff9fb2"/>

    <!-- Right ear -->
    <rect x="42" y="7" width="8" height="9" fill="#d89568"/>
    <rect x="43" y="8" width="5" height="6" fill="#ff9fb2"/>

    <!-- Face -->
    <rect x="14" y="13" width="36" height="24" fill="#e7aa7b"/>
    <rect x="23" y="14" width="18" height="23" fill="#fff4e8"/>
    <rect x="19" y="18" width="26" height="18" fill="#fff4e8"/>

    <!-- Forehead markings -->
    <rect x="27" y="14" width="4" height="7" fill="#d89568"/>
    <rect x="34" y="14" width="4" height="7" fill="#d89568"/>

    <!-- Eyes -->
    <rect x="20" y="22" width="7" height="8" fill="#392b35"/>
    <rect x="37" y="22" width="7" height="8" fill="#392b35"/>

    <rect x="21" y="23" width="2" height="2" fill="#ffffff"/>
    <rect x="38" y="23" width="2" height="2" fill="#ffffff"/>

    <!-- Blush -->
    <rect x="16" y="30" width="6" height="3" fill="#ffb1b5"/>
    <rect x="42" y="30" width="6" height="3" fill="#ffb1b5"/>

    <!-- Nose -->
    <rect x="30" y="29" width="5" height="4" fill="#ff8fa5"/>

    <!-- Mouth -->
    <rect x="29" y="33" width="3" height="2" fill="#392b35"/>
    <rect x="33" y="33" width="3" height="2" fill="#392b35"/>
    <rect x="31" y="35" width="3" height="2" fill="#392b35"/>

    <!-- Whiskers -->
    <rect x="8" y="28" width="7" height="1" fill="#392b35"/>
    <rect x="7" y="32" width="8" height="1" fill="#392b35"/>
    <rect x="49" y="28" width="7" height="1" fill="#392b35"/>
    <rect x="49" y="32" width="8" height="1" fill="#392b35"/>

    <!-- Collar -->
    <rect x="22" y="38" width="20" height="3" fill="#ef6f91"/>

    <!-- Bell -->
    <rect x="30" y="40" width="5" height="5" fill="#f5c84c"/>
    <rect x="31" y="44" width="3" height="2" fill="#d69b26"/>

</svg>